name: snapshot
on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours; gentle on Manifold's API
  workflow_dispatch:
permissions:
  contents: write
concurrency: snapshot
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Fetch Manifold snapshot (keeps old data if the API fails)
        run: PYTHONPATH=src python -m pmtracker.cli snapshot
      - name: Commit small data files
        run: |
          git config user.name "snapshot-bot"
          git config user.email "snapshot-bot@users.noreply.github.com"
          git add data/snapshot.json data/digest.md
          if ! git diff --cached --quiet; then git commit -m "chore(data): refresh Manifold snapshot"; git push; fi
